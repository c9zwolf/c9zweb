<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="هذه الصفحة غير متوفرة حاليًا — C9Z">
  <title>الصفحة غير متوفرة حاليًا | C9Z</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #101010;
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --red: #e32636;
      --red-dark: #a90f1c;
      --line: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(227,38,54,.10), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .page {
      position: relative;
      width: min(100%, 720px);
      text-align: center;
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
      box-shadow: 0 24px 90px rgba(0,0,0,.42);
      animation: appear .65s ease-out both;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: clamp(38px, 7vh, 64px);
      color: var(--text);
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: .14em;
      direction: ltr;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--red);
      border-radius: 10px;
      color: var(--red);
      font-size: 1rem;
      letter-spacing: -.06em;
      box-shadow: 0 0 24px rgba(227,38,54,.12);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(227,38,54,.35);
      border-radius: 999px;
      background: rgba(227,38,54,.08);
      color: #ff6570;
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px rgba(227,38,54,.8);
    }

    .code {
      margin: 0;
      color: var(--red);
      font-size: clamp(4.4rem, 16vw, 7.5rem);
      font-weight: 950;
      line-height: .98;
      letter-spacing: -.075em;
      direction: ltr;
      text-shadow: 0 0 45px rgba(227,38,54,.15);
    }

    h1 {
      margin: 22px 0 14px;
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      line-height: 1.35;
      letter-spacing: -.035em;
    }

    .description {
      max-width: 470px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(.96rem, 2.6vw, 1.08rem);
      line-height: 1.9;
    }

    .divider {
      width: 54px;
      height: 3px;
      margin: 28px auto;
      border-radius: 5px;
      background: var(--red);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 48px;
      padding: 13px 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: .95rem;
      font-weight: 750;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.28); }
    .button-primary {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
    }
    .button-primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
    .button-secondary { background: rgba(255,255,255,.025); }

    footer {
      margin-top: 42px;
      color: #66666d;
      font-size: .78rem;
      letter-spacing: .03em;
    }
    footer span { color: var(--red); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .page { border-radius: 17px; padding: 30px 20px; }
      .brand { margin-bottom: 42px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
      footer { margin-top: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <a class="brand" href="index.html" aria-label="C9Z — الصفحة الرئيسية">
      <span class="brand-mark">C9Z</span>
      <span>C9Z</span>
    </a>

    <p class="code" aria-label="خطأ 503">503</p>
    <h1 id="page-title">هذه الصفحة غير متوفرة حاليًا</h1>
    <p class="description">
      نعمل على تحسين تجربة C9Z. يرجى العودة لاحقًا، أو التواصل معنا إذا كنت تحتاج إلى مساعدة.
    </p>
    <div class="divider" aria-hidden="true"></div>

    <nav class="actions" aria-label="روابط المساعدة">
      <a class="button button-primary" href="../index.html">
        <span aria-hidden="true">←</span> العودة إلى الرئيسية
      </a>
      <a class="button button-secondary" href="https://t.me/c9zwolfbot" target="_blank" rel="noopener noreferrer">
        التواصل عبر Telegram <span aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>© <span>C9Z</span> — CYBER HARDWARE &amp; RESEARCH</footer>
  </main>
</body>
</html>
