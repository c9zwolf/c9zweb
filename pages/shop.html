body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.7;overflow-x:hidden}

[hidden]{display:none!important}

.navr{display:flex;align-items:center;gap:6px}

.nl{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center}

.nl:hover{color:var(--text)}

.cartbtn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--red);background:rgba(0,0,0,.4);color:var(--text);font-weight:800}

.cartbtn b{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-inline-start:8px;border-radius:11px;background:var(--red);font-size:.8rem}

.bump{animation:bump .4s}

@keyframes bump{50%{transform:scale(1.4)}}

.wrap{max-width:1180px;margin:0 auto;padding:50px max(5vw,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)) 70px}

.head{text-align:center;margin-bottom:34px;position:relative}

.head::after{content:"";display:block;width:70px;height:3px;background:var(--red);margin:14px auto 0;box-shadow:0 0 14px var(--red)}

.head h1{font-size:clamp(2rem,6vw,3.2rem);margin:0}

.head p{color:var(--muted);margin:4px 0 0}

.muted{color:var(--muted)}

.price{color:var(--red);font-weight:800;font-size:1.2rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}

.pc{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*60ms);transition:transform .35s,border-color .35s,box-shadow .35s}

@keyframes rise{from{opacity:0;transform:translateY(22px)}}

.art{background:radial-gradient(circle at 50% 30%,rgba(255,0,34,.18),transparent 65%),#080808;padding:14px}

.art svg,.art img{width:100%;height:auto;display:block}

.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}

.bd .btn{margin-top:auto}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.row h3{margin:0;font-size:1.2rem}

.tg{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 10px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:12px;font-weight:800;border:1px solid var(--red);color:var(--text);background:rgba(0,0,0,.4);transition:transform .25s,box-shadow .25s, .25s}

.btn.main{background:var(--red);border:0}

.btn:active{transform:scale(.97)}

.btn:disabled{opacity:.4;cursor:not-allowed}

@media(hover:hover){.pc:hover{transform:translateY(-6px);border-color:var(--red);box-shadow:0 12px 34px rgba(255,0,34,.18)}.btn:not(:disabled):hover{box-shadow:0 0 22px rgba(255,0,34,.45)}.nl:hover{background:var(--panel)}}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:90vh;overflow:auto}

dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}

dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}

@keyframes pop{from{opacity:0;transform:scale(.94)}}

.mb{padding:20px;display:grid;gap:12px}

.mh{display:flex;justify-content:space-between;align-items:center}

.mh h2{margin:0}

.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text)}

.acts{display:flex;gap:10px;flex-wrap:wrap}

.sp{width:100%;border-collapse:collapse}

.sp td:first-child{color:var(--muted);width:40%}

.back{display:inline-block;margin-bottom:22px;font-weight:600}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}

.pimg{border:1px solid var(--line);border-radius:20px;overflow:hidden}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px}

.qty button{width:44px;height:44px;background:none;border:0;color:var(--text);font-size:1.3rem}

.qty span{min-width:36px;text-align:center;font-weight:800}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:40}

.scrim.on{opacity:1;visibility:visible}

.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100vw);background:var(--panel);border-inline-end:1px solid var(--line);z-index:50;display:flex;flex-direction:column;transform:translateX(-105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.drawer.on{transform:none;visibility:visible}

.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}

.dl{flex:1;overflow:auto;padding:6px 18px}

.ci{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

    <div class="tot"><span>الإجمالي</span><span id="tot"></span></div>

    <button class="btn main" id="chk">إتمام الطلب</button>

    <button class="del" id="clr">إفراغ السلة</button>

  </div>

</aside>

<dialog id="dlg"></dialog>

<dialog id="cod"></dialog>

<div class="toast" id="toast" role="status"></div>



<script>

(function(){

// عدّل الأسعار والأوصاف والمواصفات والصور (img) لكل جهاز هنا

var P = [
  {
    id: 'c9z-2', name: 'C9Z-2',
    price: 90000, img: '', tag: 'C9Z DEVICE',
    desc: 'جهاز محمول لاختبار اختراق الامن اللاسلكي وبطايق nfc/rfid.',
    specs: [['المعالج', 'ESP32'], ['Wi-Fi', '2.4GHz'], ['المميزات', 'wifi, ble, rf, nfc / rfid'], ['البرامج', 'Bruce / Marauder']]
  },
  {
    id: 'c9z-3', name: 'C9Z-3',
    price: 50000, img: '', tag: 'C9Z DEVICE',
    desc: 'جهاز محمول للمشاريع والتجارب التقنية والأمن السيبراني.',
    specs: [['المعالج', 'ESP32'], ['Wi-Fi', '2.4GHz'], ['Bluetooth', 'مدعوم'], ['البرامج', 'Bruce / Marauder']]
  },
  {
    id: 'c9z-4', name: 'C9Z-4',
    price: 60000, img: '', tag: 'C9Z DEVICE',
    desc: 'جهاز C9Z محمول يعمل كجامر مختبرات.',
    specs: [['المعالج', 'ESP32'], ['Wi-Fi', '2.4GHz'], ['المميزات', 'wifi, ble, nrf'], ['البرامج', 'Bruce / Marauder']]  },
  {
    id: 'c9z-5', name: 'C9Z-5',
    price: 50000, img: '', tag: 'C9Z DEVICE',
    desc: 'جهاز C9Z محمول لاختبار اختراق الامن اللاسلكي.',
    specs: [['المعالج', 'ESP32'], ['Wi-Fi', '2.4GHz'], ['المميزات', 'wifi, ble, rf, nrf'], ['البرامج', 'Bruce / Marauder']]  },
  {
    id: 'c9z-7', name: 'C9Z-7',
    price: 120000, img: '', tag: 'C9Z DEVICE',
    desc: 'جهاز C9Z محمود لاختبار اختراق الامن اللاسلكي.',
    specs: [['المعالج', 'ESP32'], ['Wi-Fi', '2.4GHz'], ['المميزات', 'wifi, ble, rf, nrf'], ['البرامج', 'Bruce / Marauder / vallhala']]  },
];
var $=function(x){return document.getElementById(x)};

var m=function(n){return '<bdi>'+Number(n).toLocaleString('en-US')+' د.ع</bdi>'};

function find(id){for(var k=0;k<P.length;k++)if(P[k].id===id)return P[k]}

function art(p){

  if(p.img)return '<img src="'+p.img+'" alt="'+p.id+'">';

  var n=+p.id.split('-')[1],b='';

  for(var k=0;k<n;k++){var h=3+k*1.6;b+='<rect x="'+(52+k*9)+'" y="'+(88-h)+'" width="5" height="'+h+'" rx="1" fill="#ff0022" opacity=".8"/>'}

  return '<svg viewBox="0 -8 200 158" role="img" aria-label="'+p.id+'" style="direction:ltr"><line x1="150" y1="18" x2="168" y2="0" stroke="#2f2f35" stroke-width="4" stroke-linecap="round"/><circle cx="168" cy="0" r="3" fill="#ff0022"/><rect x="28" y="16" width="144" height="118" rx="18" fill="#121215" stroke="#34343a" stroke-width="2"/><path d="M46 17h108" stroke="#ff0022" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><rect x="38" y="26" width="124" height="74" rx="11" fill="#ff0022" opacity=".08"/><rect x="42" y="30" width="116" height="66" rx="8" fill="#050505" stroke="#ff0022" stroke-opacity=".55"/><path d="M42 44h116M42 72h116M42 86h116" stroke="#fff" stroke-opacity=".05"/><text x="100" y="58" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="700">'+(p.name||p.id)+'</text>'+b+'<circle cx="62" cy="116" r="7" fill="#1c1c20" stroke="#34343a"/><circle cx="86" cy="116" r="7" fill="#1c1c20" stroke="#34343a"/><g fill="#34343a"><circle cx="103" cy="110" r="1.6"/><circle cx="103" cy="116" r="1.6"/><circle cx="103" cy="122" r="1.6"/></g><rect x="118" y="108" width="34" height="14" rx="7" fill="#1c1c20" stroke="#34343a"/><circle cx="145" cy="115" r="3" fill="#ff0022"/></svg>';

}

function specs(p){return '<table class="sp">'+p.specs.map(function(s){return '<tr><td>'+s[0]+'</td><td>'+s[1]+'</td></tr>'}).join('')+'</table>'}

window.C9_CONFIG = {BOT_TOKEN: 'ADD_NEW_BOT_TOKEN_HERE', CHAT_ID: 'ADD_CHAT_ID_HERE'};

var cart={};

try{var c=JSON.parse(localStorage.getItem('c9cart')||'{}');for(var id in c)if(find(id)&&c[id]>0)cart[id]=Math.min(99,Math.floor(+c[id])||1)}catch(e){}

function save(){try{localStorage.setItem('c9cart',JSON.stringify(cart))}catch(e){}}

function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}

function rc(bump){

  var n=0,t=0,h='';

  Object.keys(cart).forEach(function(id){var p=find(id),q=cart[id];n+=q;t+=q*p.price;

    h+='<div class="ci" data-id="'+id+'"><div class="th">'+art(p)+'</div><div><b><bdi>'+id+'</bdi></b><div class="price">'+m(p.price)+'</div></div><div class="ctl"><div class="mini"><button data-act="dec" aria-label="إنقاص">−</button><span>'+q+'</span><button data-act="inc" aria-label="زيادة">+</button></div><button class="del" data-act="del">حذف</button></div></div>'});

  $('dl').innerHTML=h||'<div class="empty">السلة فارغة</div>';

  $('tot').innerHTML=m(t);$('chk').disabled=!n;$('clr').hidden=!n;

  var b=$('cnt');b.textContent=n;

  if(bump){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}

}

function add(id,q){if(!find(id))return;cart[id]=Math.min(99,(cart[id]||0)+(q||1));save();rc(true);toast('تمت إضافة '+id+' إلى السلة')}

function od(open){$('drawer').classList.toggle('on',open);$('scrim').classList.toggle('on',open);if(open)$('cx').focus();else $('cartbtn').focus()}



$('cartbtn').onclick=function(){od(true)};$('cx').onclick=$('scrim').onclick=function(){od(false)};

document.addEventListener('keydown',function(e){if(e.key==='Escape')od(false)});

$('dl').addEventListener('click',function(e){var a=e.target.closest('[data-act]');if(!a)return;var id=a.closest('.ci').dataset.id,k=a.dataset.act;

  if(k==='inc')cart[id]=Math.min(99,cart[id]+1);else if(k==='dec'){cart[id]--;if(cart[id]<1)delete cart[id]}else delete cart[id];save();rc()});

$('clr').onclick=function(){cart={};save();rc()};

$('chk').onclick=function(){od(false);co(1)};



var q='',sort='';

function card(p,i){return '<div class="pc" tabindex="0" role="button" aria-label="تفاصيل '+(p.name||p.id)+'" data-id="'+p.id+'" style="--i:'+i+'"><div class="art"><span class="num">'+('0'+p.id.split('-')[1]).slice(-2)+'</span>'+art(p)+'</div><div class="bd"><div class="row"><h3><bdi>'+(p.name||p.id)+'</bdi></h3><span class="tg">'+p.tag+'</span></div><div class="price">'+m(p.price)+'</div><div class="ba"><button class="btn main" data-add>أضف للسلة</button><button class="btn ic" data-view aria-label="عرض سريع">👁</button></div></div></div>'}

function dg(){var l=P.filter(function(p){return p.id.indexOf(q)>-1});if(sort)l=l.slice().sort(function(a,b){return sort==='lo'?a.price-b.price:b.price-a.price});$('grid').innerHTML=l.map(function(p,i){return card(p,i)}).join('');$('none').hidden=!!l.length}

$('srch').oninput=function(){q=this.value.trim().toLowerCase();dg()};$('sort').onchange=function(){sort=this.value;dg()};

dg();setTimeout(function(){$('grid').classList.add('re')},1200);

function om(id){var p=find(id);$('dlg').innerHTML='<div class="mb"><div class="mh"><h2><bdi>'+(p.name||p.id)+'</bdi></h2><button class="x" data-close aria-label="إغلاق">✕</button></div><div class="art">'+art(p)+'</div><div class="price">'+m(p.price)+'</div><p class="muted" style="margin:0">'+p.desc+'</p>'+specs(p)+'<div class="acts"><button class="btn main" data-add="'+p.id+'">أضف للسلة</button><a class="btn" href="#'+p.id+'" data-close>عرض التفاصيل</a></div></div>';$('dlg').showModal()}

$('grid').addEventListener('click',function(e){var c=e.target.closest('.pc');if(!c)return;if(e.target.closest('[data-add]'))add(c.dataset.id);else om(c.dataset.id)});

$('grid').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('pc')){e.preventDefault();om(e.target.dataset.id)}});

$('dlg').addEventListener('click',function(e){var t=e.target;if(t===this||t.closest('[data-close]'))this.close();var a=t.closest('[data-add]');if(a&&a.dataset.add)add(a.dataset.add)});



var TG=window.C9_CONFIG||{};

var cd={n:'',p:'',a:'',t:''};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function ci(){return Object.keys(cart).map(function(id){return{id:id,q:cart[id],price:find(id).price}})}

function total(){return ci().reduce(function(s,x){return s+x.q*x.price},0)}

function stp(n){return '<div class="steps" aria-hidden="true"><i class="on"></i><i class="'+(n>1?'on':'')+'"></i><i class="'+(n>2?'on':'')+'"></i></div>'}

function co(n,msg){

 var h='<div class="mb"><div class="mh"><h2>'+['','بيانات الطلب','مراجعة الطلب','تم الطلب'][n]+'</h2><button class="x" data-close aria-label="إغلاق">✕</button></div>'+stp(n);

 if(n===1)h+='<form id="cf" novalidate class="mb" style="padding:0"><label class="lab">الاسم<input class="fld" name="n" autocomplete="name" required maxlength="60" value="'+esc(cd.n)+'"></label><label class="lab">رقم الهاتف<input class="fld" name="p" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required maxlength="20" value="'+esc(cd.p)+'"></label><label class="lab">العنوان<input class="fld" name="a" autocomplete="street-address" required maxlength="200" value="'+esc(cd.a)+'"></label><label class="lab">ملاحظات (اختياري)<textarea class="fld" name="t" maxlength="500">'+esc(cd.t)+'</textarea></label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="er" role="alert"></div><button class="btn main" type="submit">مراجعة الطلب</button></form>';

 else if(n===2)h+='<div class="sum">'+ci().map(function(x){return '<div><span><bdi>'+x.id+'</bdi> × '+x.q+'</span><span>'+m(x.q*x.price)+'</span></div>'}).join('')+'<div><b>الإجمالي</b><b>'+m(total())+'</b></div></div><div class="sum"><div><span>الاسم</span><span>'+esc(cd.n)+'</span></div><div><span>الهاتف</span><bdi>'+esc(cd.p)+'</bdi></div><div><span>العنوان</span><span>'+esc(cd.a)+'</span></div>'+(cd.t?'<div><span>ملاحظات</span><span>'+esc(cd.t)+'</span></div>':'')+'</div><div class="err" id="er" role="alert">'+(msg||'')+'</div><div class="acts"><button class="btn" id="ed">تعديل</button><button class="btn main" id="ok">تأكيد الطلب</button></div>';

 else h+='<div class="ok"><div class="big">✅</div><h3>تم استلام طلبك</h3><p class="muted">رقم الطلب: <bdi>'+esc(msg)+'</bdi><br>سنتواصل معك على رقم هاتفك لتأكيد التوصيل.</p><button class="btn main" data-close>متابعة التسوق</button></div>';

 $('cod').innerHTML=h+'</div>';if(!$('cod').open)$('cod').showModal();

}

function send(btn){

 var items=ci();if(!items.length){co(1);return}

 if(!TG.BOT_TOKEN||!TG.CHAT_ID){co(2,'هنالك خلل بسيط يرجى التواصل مع الدعم.');return}

 var last=0;try{last=+localStorage.getItem('c9last')||0}catch(e){}

 if(Date.now()-last<30000){co(2,'انتظر قليلاً قبل إرسال طلب جديد.');return}

 var id='C9-'+Date.now().toString(36).toUpperCase();

 var msg='🐺 طلب جديد '+id+'\n\n👤 '+cd.n+'\n📞 '+cd.p+'\n📍 '+cd.a+(cd.t?'\n📝 '+cd.t:'')+'\n\n'+items.map(function(x){return '• '+x.id+' × '+x.q+' — $'+x.q*x.price}).join('\n')+'\n\n💰 الإجمالي: $'+total();

 btn.disabled=true;btn.textContent='جاري الإرسال…';

 fetch('https://api.telegram.org/bot'+TG.BOT_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG.CHAT_ID,text:msg})}).then(function(r){if(!r.ok)throw 0;try{localStorage.setItem('c9last',Date.now())}catch(e){}cart={};save();rc();co(3,id)}).catch(function(){co(2,'تعذّر إرسال الطلب. تحقق من الاتصال ومن صحة التوكن ورقم المحادثة، ثم حاول مرة أخرى.')});

}

$('cod').addEventListener('click',function(e){var t=e.target;if(t===this||t.closest('[data-close]'))this.close();if(t.id==='ed')co(1);if(t.id==='ok')send(t)});

$('cod').addEventListener('submit',function(e){e.preventDefault();var f=e.target,er=$('er');if(f.website.value)return;

 var n=f.n.value.trim(),p=f.p.value.trim().replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}),a=f.a.value.trim();

 cd={n:n,p:p,a:a,t:f.t.value.trim()};

 if(n.length<2){er.textContent='أدخل الاسم الكامل.';return}

 if(!/^\\+?[0-9\s-]{8,18}$/.test(p)){er.textContent='أدخل رقم هاتف صحيحاً (أرقام فقط).';return}

 if(a.length<5){er.textContent='أدخل عنواناً واضحاً.';return}

 co(2)});

var cur,pq=1;

function dp(p){cur=p.id;pq=1;$('prod').innerHTML='<a class="back" href="#shop">العودة إلى المتجر ←</a><div class="pgrid"><div class="pimg art">'+art(p)+'</div><div><span class="tg">'+p.tag+'</span><h1><bdi>'+(p.name||p.id)+'</bdi></h1><div class="price">'+m(p.price)+'</div><p class="muted">'+p.desc+'</p>'+specs(p)+'<div class="qrow"><div class="qty"><button data-q="-1" aria-label="إنقاص">−</button><span id="q">1</span><button data-q="1" aria-label="زيادة">+</button></div><button class="btn main" data-addq>أضف للسلة</button></div></div></div>'}

$('prod').addEventListener('click',function(e){var q=e.target.closest('[data-q]');if(q){pq=Math.max(1,Math.min(99,pq+ +q.dataset.q));$('q').textContent=pq}else if(e.target.closest('[data-addq]'))add(cur,pq)});

function route(){var p=find(decodeURIComponent(location.hash.slice(1)));$('v-shop').hidden=!!p;$('v-prod').hidden=!p;if(p){dp(p);document.title=(p.name||p.id)+' – c9zwolf'}else document.title='متجر c9zwolf';window.scrollTo(0,0)}

window.addEventListener('hashchange',route);

rc();route();

})();

</script>
